<!doctype html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sticker Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  />

</head>


<body>

  <main class="app">

    <header class="topbar">

      <div>

        <h1>
          Sticker Chat
        </h1>

        <div class="subtitle">
          聊天的时候，它会自己决定要不要甩表情包 ✨
        </div>

      </div>


      <button
        id="clearButton"
        class="clear-button"
        type="button"
      >
        清空
      </button>

    </header>


    <section
      id="chat"
      class="chat"
    >

      <div class="message assistant">

        <div class="bubble">
          宝宝我在 😼 现在这个才是聊天版。
        </div>

      </div>

    </section>


    <div
      id="typing"
      class="typing hidden"
    >
      正在回复…
    </div>


    <footer class="composer">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="发消息..."
      ></textarea>


      <button
        id="sendButton"
        type="button"
      >
        发送
      </button>

    </footer>

  </main>


  <script src="/app.js"></script>

</body>

</html>
